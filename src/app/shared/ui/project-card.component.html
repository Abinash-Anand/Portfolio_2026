<article
  class="border-line bg-surface hover:border-blue/50 focus-within:border-blue/50 relative flex h-full flex-col gap-3 rounded-xl border p-6 transition-colors"
>
  <h3 class="font-display text-xl font-semibold tracking-tight">
    <a
      [routerLink]="['/work', slug()]"
      [appTrack]="{ name: 'project_open', slug: slug() }"
      class="after:absolute after:inset-0 after:content-['']"
    >
      {{ title() }}
    </a>
  </h3>
  @if (summary()) {
    <p class="text-muted text-sm leading-relaxed">{{ summary() }}</p>
  }
  @if (stack().length) {
    <ul class="mt-auto flex flex-wrap gap-2 pt-2" aria-label="Technologies" i18n-aria-label>
      @for (item of stack(); track item) {
        <li class="border-line text-muted rounded-full border px-2.5 py-0.5 font-mono text-xs">
          {{ item }}
        </li>
      }
    </ul>
  }
</article>
