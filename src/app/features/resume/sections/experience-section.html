<ol class="flex flex-col gap-10">
  @for (entry of entries(); track entry.id) {
    <li class="border-line border-l pl-6">
      <p class="text-muted font-mono text-xs tracking-wider uppercase">{{ entry.period }}</p>
      <p
        role="heading"
        [attr.aria-level]="level()"
        class="font-display mt-1 text-xl font-semibold tracking-tight"
      >
        {{ entry.role }}
      </p>
      <p class="text-muted text-sm">{{ entry.organisation }} · {{ entry.location }}</p>
      <ul class="mt-4 flex list-disc flex-col gap-2 pl-5 text-sm leading-relaxed marker:text-blue">
        @for (highlight of entry.highlights; track $index) {
          <li>{{ highlight }}</li>
        }
      </ul>
    </li>
  }
</ol>
