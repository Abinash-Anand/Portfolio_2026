<div class="flex flex-col gap-8">
  @for (group of groups(); track group.id) {
    <div>
      <p role="heading" [attr.aria-level]="level()" class="text-muted font-mono text-xs tracking-wider uppercase">
        {{ group.label }}
      </p>
      <ul class="mt-3 flex flex-wrap gap-2">
        @for (item of group.items; track item) {
          <li class="border-line bg-surface rounded-full border px-3 py-1 text-sm">{{ item }}</li>
        }
      </ul>
    </div>
  }

  @if (spoken().length) {
    <div>
      <p
        role="heading"
        [attr.aria-level]="level()"
        class="text-muted font-mono text-xs tracking-wider uppercase"
        i18n
      >
        Spoken languages
      </p>
      <ul class="mt-3 flex flex-col gap-1 text-sm">
        @for (language of spoken(); track language.name) {
          <li>
            <span class="font-semibold">{{ language.name }}</span>
            <span class="text-muted"> · {{ language.level }}</span>
          </li>
        }
      </ul>
    </div>
  }
</div>
