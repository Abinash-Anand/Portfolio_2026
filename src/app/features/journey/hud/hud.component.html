<div class="pointer-events-none absolute inset-0 z-20 flex flex-col justify-between p-4 md:p-6">
  <div class="hidden items-start justify-between gap-4 md:flex" aria-hidden="true">
    <p class="hud-label">{{ identity }}</p>
    <p class="hud-label text-right">
      FPS: {{ readout()?.fps ?? '--' }} | LATENCY: SIM | ENGINE: {{ readout()?.engine ?? 'NONE' }}
    </p>
  </div>
  <div class="mt-auto flex flex-wrap items-end justify-between gap-2 md:gap-3">
    <a
      routerLink="/resume"
      class="hud-button pointer-events-auto"
      (click)="resume2d.emit()"
      (mouseenter)="cue.emit()"
    >
      <svg
        viewBox="0 0 16 16"
        width="14"
        height="14"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        aria-hidden="true"
      >
        <path d="M4 1.75h5.5L12.25 4.5v9.75H4z" />
        <path d="M9.5 1.75V4.5h2.75M6 8h4M6 10.5h4" />
      </svg>
      <span i18n>[ Standard 2D resume ]</span>
    </a>
    <div class="pointer-events-auto flex flex-wrap justify-end gap-2">
      <button
        type="button"
        class="hud-button"
        [attr.aria-pressed]="audioOn()"
        (click)="audioToggle.emit()"
        (mouseenter)="cue.emit()"
      >
        [ {{ audioLabel() }} ]
      </button>
      <button
        type="button"
        class="hud-button"
        (click)="graphicsCycle.emit()"
        (mouseenter)="cue.emit()"
      >
        [ GRAPHICS: {{ graphicsLabel() }} ]
      </button>
    </div>
  </div>
</div>
