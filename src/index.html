    <script>
      // Runs before first paint. Hidden/animated initial states in CSS are gated on
      // `html.motion-ok`, so reduced-motion users and no-JS visitors always see content.
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          root.classList.add('motion-ok');
        }
      })();
    </script>
