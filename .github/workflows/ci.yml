name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` also runs the postinstall sync, which uses the committed fixture (no token needed in CI).
      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint (app, templates, scripts, layer boundaries)
        run: npm run lint

      - name: Type-check build scripts
        run: npm run typecheck:scripts

      - name: Test build scripts
        run: npm run test:scripts

      - name: Test app
        run: npm test -- --no-watch

      # Fails on size-budget errors (angular.json). Uses the fixture, so CI never depends on the GitHub API.
      - name: Build
        run: npm run build

      # The same checks that run against production after a deploy, here against the build itself.
      - name: Smoke test the built site
        run: |
          npm run serve:dist -- --port 4300 &
          sleep 5
          npm run smoke -- http://localhost:4300

      # Serves the built site with the rules from vercel.json and checks Lighthouse (mobile) on the main pages:
      # performance and layout shift, accessibility, SEO (thresholds in lighthouserc.json). The reports are kept as a build artifact.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.14 autorun --config=lighthouserc.json

      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
