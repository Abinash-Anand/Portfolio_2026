name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 is the toolchain declared in .mise.toml; 24 is the current LTS line the project is also developed on.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # Same pnpm version as .mise.toml. It must be installed before setup-node so the pnpm store can be cached.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check application
        run: pnpm exec tsc --noEmit

      - name: Type-check build scripts
        run: pnpm exec tsc --noEmit --strict --skipLibCheck --target ES2022 --module nodenext --moduleResolution nodenext --allowImportingTsExtensions scripts/sync-github.ts scripts/portfolio-contract.ts

      # `pnpm build` is the production build: it runs the authenticated GitHub sync, so it needs PORTFOLIO_GH_TOKEN and
      # real data, which only Vercel provides (secrets are also unavailable to pull requests from forks). CI therefore
      # stays offline and secret-free: it synchronizes the checked-in development fixture and compiles the bundle. The
      # output is never deployed; it exists so the tests below can scan the built bundle for tokens and GitHub hosts.
      - name: Build (offline, development fixture data)
        env:
          PORTFOLIO_DATA_MODE: fixture
        run: |
          node --experimental-strip-types scripts/sync-github.ts
          pnpm exec vite build

      # Offline contract, synchronization, security and generic-rendering tests; no network, no token.
      - name: Test
        run: pnpm test

      - name: Audit production dependencies
        if: matrix.node == 24
        run: pnpm audit --prod --audit-level=high
