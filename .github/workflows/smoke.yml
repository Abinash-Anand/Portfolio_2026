name: Smoke test production

# Runs after every successful production deployment (and on demand), so a broken release is noticed within
# minutes instead of by a visitor. Failures show up in the Actions tab and in GitHub's notification emails.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Site to check (defaults to the production deployment)
        required: false
      expect_real_data:
        description: Fail if the page still shows the sample GitHub data
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    env:
      SITE: ${{ inputs.url || github.event.deployment_status.environment_url || 'https://abinashanand.vercel.app' }}
      REAL_DATA: ${{ github.event_name == 'deployment_status' || inputs.expect_real_data }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Smoke test
        run: |
          flags=""
          if [ "$REAL_DATA" = "true" ]; then flags="--expect-real-data"; fi
          npm run smoke -- "$SITE" $flags
